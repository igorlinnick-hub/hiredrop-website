name: Synthetic journey

# Every 30 minutes, walk the main paths of PROD the way a person does: signed out (/, /login,
# /signup, /privacy, /terms, the API's /health), then signed in as the test account (sign
# in, dashboard, every Settings section, History, onboarding steps 1 and 10), at desktop and
# phone width. A red run is a broken path, found before a user writes in. The checks and
# what they deliberately never touch: scripts/synthetic/journey.py.
#
# This repo is PUBLIC: the log and the artifacts can be read by anyone. The script prints
# no page text and scrubs error lines, and its screenshots of signed-in pages are
# layout-only. Never add --full-screenshots here, and never echo the secrets.
#
# Until the SYNTHETIC_EMAIL / SYNTHETIC_PASSWORD repo secrets exist, every run skips with a
# notice, so this file is harmless to merge first.

on:
  schedule:
    # Off the hour marks, where GitHub delays scheduled runs the most.
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: read

# A run that is still going when the next one is due finishes first; the next waits.
concurrency:
  group: synthetic-journey
  cancel-in-progress: false

jobs:
  journey:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Skip until the test account's secrets exist
        id: gate
        env:
          SYNTHETIC_EMAIL: ${{ secrets.SYNTHETIC_EMAIL }}
          SYNTHETIC_PASSWORD: ${{ secrets.SYNTHETIC_PASSWORD }}
        run: |
          if [ -z "$SYNTHETIC_EMAIL" ] || [ -z "$SYNTHETIC_PASSWORD" ]; then
            echo "::notice title=Synthetic journey skipped::Add the SYNTHETIC_EMAIL and SYNTHETIC_PASSWORD repo secrets (the test account) to turn it on."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.gate.outputs.ready == 'true'
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        if: steps.gate.outputs.ready == 'true'
        with:
          python-version: "3.12"

      - name: Install Playwright and its bundled Chromium
        if: steps.gate.outputs.ready == 'true'
        run: |
          python -m pip install playwright==1.63.0
          python -m playwright install --with-deps chromium

      - name: Walk the journey
        if: steps.gate.outputs.ready == 'true'
        env:
          SYNTHETIC_EMAIL: ${{ secrets.SYNTHETIC_EMAIL }}
          SYNTHETIC_PASSWORD: ${{ secrets.SYNTHETIC_PASSWORD }}
        run: python scripts/synthetic/journey.py --artifacts "$RUNNER_TEMP/synthetic"

      - name: Keep the failure evidence
        if: failure() && steps.gate.outputs.ready == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: synthetic-journey-${{ github.run_id }}
          path: ${{ runner.temp }}/synthetic
          retention-days: 7
          if-no-files-found: ignore
